aid: babylon-health

name: Babylon Health

description: 'Babylon Health is a digital health service provider offering virtual medical consultations, AI‑driven health assessments, and remote monitoring through its mobile app and web platform. Founded in 2013 in the United Kingdom, the company partners with national health systems and private insurers to deliver accessible primary care, mental health support, and chronic disease management. It operates in multiple countries, including the UK, US, Canada, and Rwanda, and has raised significant venture funding to expand its telehealth services.'

